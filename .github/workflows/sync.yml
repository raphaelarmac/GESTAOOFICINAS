name: Executar Sync UCA

on:
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pymysql

      - name: Rodar o script
        env:
          ARMAC_DB_HOST: ${{ secrets.ARMAC_DB_HOST }}
          ARMAC_DB_PORT: ${{ secrets.ARMAC_DB_PORT }}
          ARMAC_DB_USER: ${{ secrets.ARMAC_DB_USER }}
          ARMAC_DB_PASSWORD: ${{ secrets.ARMAC_DB_PASSWORD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
        run: python sync_uca.py
